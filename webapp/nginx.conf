server {
    listen 80;

    root /usr/share/nginx/html;
    index index.html;

    # Compress text files: the JS bundle (and the map library) download
    # several times smaller, so the shop opens faster on mobile networks.
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml;

    # Never cache index.html — forces fresh JS bundle on every load
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Hashed JS/CSS/images — cache forever (new hash = new URL)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff2?)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
